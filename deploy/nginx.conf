server {
    listen 80;
    server_name _;

    # Basic auth - the app has no built-in login
    auth_basic "Training Video Generator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Large uploads (background music, voiceover audio)
    client_max_body_size 300m;

    # Video export / capture jobs can run for a long time
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://app:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Runtime-generated media: Next.js production only serves public/ files
    # that existed at build time, so nginx serves these straight from disk.
    location /exports/ {
        alias /srv/media/exports/;
        add_header Accept-Ranges bytes;
    }
    location /audio/ {
        alias /srv/media/audio/;
        add_header Accept-Ranges bytes;
    }
    location /music/ {
        alias /srv/media/music/;
        add_header Accept-Ranges bytes;
    }
    location /recordings/ {
        alias /srv/media/recordings/;
        add_header Accept-Ranges bytes;
    }
}
