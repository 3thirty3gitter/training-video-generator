# HTTP: ACME challenges + redirect everything else to HTTPS
server {
    listen 80;
    server_name tvg.333ai.tech _;

    # Let's Encrypt webroot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tvg.333ai.tech$request_uri;
    }
}

# HTTPS: the app
server {
    listen 443 ssl;
    http2 on;
    server_name tvg.333ai.tech;

    ssl_certificate /etc/letsencrypt/live/tvg.333ai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvg.333ai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Basic auth - the app has no built-in login
    auth_basic "Training Video Generator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Large uploads (background music, voiceover audio)
    client_max_body_size 300m;

    # Video export / capture jobs can run for a long time
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://app:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # noVNC: view/control the interactive wizard browser running on the
    # server's virtual display. Same basic auth as the app.
    location /vnc/ {
        proxy_pass http://app:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Runtime-generated media: Next.js production only serves public/ files
    # that existed at build time, so nginx serves these straight from disk.
    location /exports/ {
        alias /srv/media/exports/;
        add_header Accept-Ranges bytes;
    }
    location /audio/ {
        alias /srv/media/audio/;
        add_header Accept-Ranges bytes;
    }
    location /music/ {
        alias /srv/media/music/;
        add_header Accept-Ranges bytes;
    }
    location /recordings/ {
        alias /srv/media/recordings/;
        add_header Accept-Ranges bytes;
    }
}
