services:
  app:
    build: .
    image: training-video-generator:latest
    container_name: tvg-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Reverse-tunnel endpoint for "local browser mode" (record-local script)
      - LOCAL_BROWSER_URL=http://172.28.0.1:9222
    # Chromium needs a larger shared memory segment than Docker's 64MB default
    shm_size: "1gb"
    volumes:
      # Project state (flat-file "database")
      - ./data/project_data.json:/app/project_data.json
      # User-generated media
      - ./data/audio:/app/public/audio
      - ./data/music:/app/public/music
      - ./data/recordings:/app/public/recordings
      - ./data/exports:/app/public/exports
      # Persistent browser profile (cookies/logins for captured sites)
      - puppeteer_profile:/app/.puppeteer_data
    expose:
      - "3456"

  nginx:
    image: nginx:1.27-alpine
    container_name: tvg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Whole deploy dir (nginx.conf as conf.d/nginx.conf + .htpasswd).
      # Directory mount (not single files): file replacements by CI tar
      # extraction get new inodes, which stale out single-file binds.
      - ./deploy:/etc/nginx/conf.d:ro
      # TLS certificates (issued by certbot on the host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
      # Serve runtime-generated media directly (Next.js prod won't serve
      # public/ files created after build)
      - ./data/exports:/srv/media/exports:ro
      - ./data/audio:/srv/media/audio:ro
      - ./data/music:/srv/media/music:ro
      - ./data/recordings:/srv/media/recordings:ro
    depends_on:
      - app

volumes:
  puppeteer_profile:

networks:
  # Pinned subnet so the host-side gateway IP is stable: the record-local
  # SSH tunnel binds the user's browser debug port on 172.28.0.1:9222
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
